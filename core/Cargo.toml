[workspace]
resolver = "3"
members = ["crates/sound-core", "crates/sound-ffi", "crates/sound-render"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sound-core = { path = "crates/sound-core" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# Без оптимизаций синтез в тестах работает в десятки раз медленнее реального времени
[profile.dev]
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
